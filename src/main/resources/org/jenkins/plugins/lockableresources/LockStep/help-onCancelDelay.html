<div>
  <p>
    Number of seconds the resources stay locked after the build is aborted inside the <code>lock</code> block.
    It works like <code>onReleaseDelay</code>, which applies when the block ends normally or fails.
  </p>
  <p>
    Set to 0 (the default) to release the resources immediately on abort.
    Not supported for remote locks (<code>serverId</code>).
  </p>
</div>
