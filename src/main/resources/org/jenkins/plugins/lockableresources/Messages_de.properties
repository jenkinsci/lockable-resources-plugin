LockableResourcesRootAction.PermissionGroup=Sperrbare Ressourcen
LockableResourcesRootAction.ManagementLink.Description=Sperrbare Ressourcen, Labels und die Sperrwarteschlange anzeigen und verwalten.
LockableResourcesRootAction.UnlockPermission.Description=Diese Berechtigung gew\u00e4hrt die M\u00f6glichkeit, Ressourcen manuell freizuschalten, die durch Builds gesperrt wurden.
LockableResourcesRootAction.ReservePermission.Description=Diese Berechtigung gew\u00e4hrt die M\u00f6glichkeit, sperrbare Ressourcen au\u00dferhalb eines Builds manuell zu reservieren.
LockableResourcesRootAction.StealPermission.Description=Diese Berechtigung gew\u00e4hrt die M\u00f6glichkeit, Ressourcen manuell zu "stehlen", die durch Builds gesperrt wurden, oder von Benutzern reservierte Ressourcen "neu zuzuweisen".
LockableResourcesRootAction.ViewPermission.Description=Diese Berechtigung gew\u00e4hrt die M\u00f6glichkeit, sperrbare Ressourcen anzuzeigen.
LockableResourcesRootAction.QueueChangeOrderPermission.Description=Diese Berechtigung gew\u00e4hrt die M\u00f6glichkeit, \
  die Warteschlange der sperrbaren Ressourcen manuell zu bearbeiten.
LockableResourcesRootAction.ConfigurePermission.Description=Diese Berechtigung gew\u00e4hrt die M\u00f6glichkeit, \
  sperrbare Ressourcen zu erstellen, zu bearbeiten und zu l\u00f6schen.
LockableResourcesRootAction.RemoteUsePermission.Description=Diese Berechtigung gew\u00e4hrt die M\u00f6glichkeit, \
  Sperren \u00fcber die Remote-Lock-REST-API zu erwerben und freizugeben. Sie sollte Maschinenbenutzern \
  erteilt werden, deren API-Tokens von entfernten Client-Controllern verwendet werden.
